# Azure Pipelines — бесплатная сборка для открытого проекта (неограниченно)
# Альтернатива GitHub Actions когда spending limit превышен.
# Работает для WPF (.NET 10) на windows-latest, повторяет шаги из .github/workflows/build.yml

trigger:
  branches:
    include: [ main, master ]
  tags:
    include: [ v* ]

pr:
  branches:
    include: [ main, master ]

pool:
  vmImage: 'windows-latest'

variables:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  DOTNET_NOLOGO: '1'

steps:
- checkout: self
  displayName: Получить код

- task: UseDotNet@2
  displayName: Поставить .NET 10
  inputs:
    version: '10.0.x'
    includePreviewVersions: true

- pwsh: |
    $v = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
    if (-not $v) { throw 'Нет версии в Directory.Build.props' }
    Write-Host "##vso[task.setvariable variable=APP_VERSION]$v"
    Write-Host "Версия: $v"
  displayName: Узнать версию

- pwsh: |
    $bad=@()
    foreach($f in Get-ChildItem scripts,tools,installer -Recurse -Include *.ps1 -File){
      $b=[IO.File]::ReadAllBytes($f.FullName)
      $hasBom=$b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
      if(-not $hasBom){$bad+=$f.FullName}
    }
    if($bad.Count -gt 0){ throw "Скрипты без BOM: $($bad -join ', ')" }
  displayName: Проверить BOM UTF-8

- script: dotnet build PingForge.slnx -c Release --artifacts-path "$(Agent.TempDirectory)/art" --nologo
  displayName: Сборка

- script: dotnet test PingForge.slnx -c Release --artifacts-path "$(Agent.TempDirectory)/art" --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory "test-results"
  displayName: Тесты

- script: dotnet run --project tools/PingForge.CatalogDump -c Release --artifacts-path "$(Agent.TempDirectory)/art" -- docs/catalog.json
  displayName: Данные каталога

- pwsh: |
    python tools/render_ui_preview.py docs/catalog.json docs/pingforge-ui-preview.html
    python tools/render_app_site.py docs/catalog.json docs/custom-tweak-by-doxaiz.html
  displayName: Витрины — перерисовать

- pwsh: |
    npm install jsdom --no-save --silent
    node tools/check_ui_preview.js docs/pingforge-ui-preview.html
    node tools/check_app_site.js docs/custom-tweak-by-doxaiz.html
  displayName: Витрины — проверки

- script: dotnet publish src/PingForge.App/PingForge.App.csproj -c Release -r win-x64 --self-contained false -o dist/compact --nologo
  displayName: Программа — compact

- script: dotnet publish src/PingForge.Service.Host/PingForge.Service.Host.csproj -c Release -r win-x64 --self-contained false -o dist/compact --nologo
  displayName: Служба — compact

- script: dotnet publish src/PingForge.App/PingForge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -o dist/portable --nologo
  displayName: Программа — portable

- script: dotnet publish src/PingForge.Service.Host/PingForge.Service.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -o dist/portable --nologo
  displayName: Служба — portable

- pwsh: |
    Get-ChildItem dist -Recurse -Include *.pdb,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue
    foreach($folder in @('dist/compact','dist/portable')){
      Copy-Item scripts/*.ps1 $folder -Force
      Copy-Item docs/УСТАНОВКА.md $folder -Force
    }
    Compress-Archive -Path dist/compact/* -DestinationPath dist/CustomTweakByDoxaiz-compact-win-x64.zip -Force
    Compress-Archive -Path dist/portable/* -DestinationPath dist/CustomTweakByDoxaiz-portable-win-x64.zip -Force
  displayName: Упаковать

- pwsh: |
    $exe='dist/portable/CustomTweakByDoxaiz.exe'
    $log=Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log'
    Remove-Item $log -ErrorAction SilentlyContinue
    $p=Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru
    if($p.ExitCode -ne 0){ throw "self-check $($p.ExitCode)" }
    Get-Content $log | Write-Host
  displayName: Живая проверка — self-check

- pwsh: |
    $ErrorActionPreference='Stop'
    function Find-Makensis{
      foreach($base in @(${env:ProgramFiles(x86)},$env:ProgramFiles)){
        if(-not $base){continue}
        $c=Join-Path $base 'NSIS\makensis.exe'
        if(Test-Path $c){return $c}
      }
      $f=Get-Command makensis -ErrorAction SilentlyContinue
      if($f){return $f.Source}
    }
    $makensis=Find-Makensis
    if(-not $makensis){
      choco install nsis --no-progress -y
      $makensis=Find-Makensis
    }
    if(-not $makensis){ throw 'makensis не найден' }
    $v="$(APP_VERSION)"
    $src=(Resolve-Path 'dist/portable').Path
    $out=(Resolve-Path 'dist').Path
    & $makensis -INPUTCHARSET UTF8 "-DVERSION=$v" "-DSOURCE_DIR=$src" "-DOUT_DIR=$out" "installer/CustomTweakByDoxaiz.nsi"
    if($LASTEXITCODE -ne 0){ throw "makensis $LASTEXITCODE" }
    Get-Item "dist/CustomTweakByDoxaiz-Setup-$v.exe" | Format-List
  displayName: Установщик NSIS

- pwsh: |
    $v="$(APP_VERSION)"
    Copy-Item dist/portable/CustomTweakByDoxaiz.exe "dist/CustomTweakByDoxaiz-$v.exe" -Force
    Copy-Item dist/portable/CustomTweakByDoxaiz.Service.exe "dist/CustomTweakByDoxaiz.Service-$v.exe" -Force
    Get-ChildItem dist -File | Where-Object {$_.Extension -in '.exe','.zip'} | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
    Get-Content dist/SHA256SUMS.txt
  displayName: SHA256

- task: PublishBuildArtifacts@1
  displayName: Публикация артефактов
  inputs:
    PathtoPublish: 'dist'
    ArtifactName: 'CustomTweakByDoxaiz-win-x64'
  condition: always()

- task: PublishTestResults@2
  displayName: Результаты тестов
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: 'test-results/**/*.trx'
  condition: always()

# === Авто-публикация в GitHub Releases (только на тегах v*) ===
# Требует 1 раз создать Service Connection в Azure:
# Project Settings → Service connections → New → GitHub → PAT (classic, scopes: repo) → имя: github.com Doxaiz
# И PAT добавить в Library → Variable Group (для CircleCI-аналога), либо прямо в GH_PAT как secret.
- pwsh: |
    $ErrorActionPreference='Stop'
    if(-not $env:GH_PAT){ Write-Host "GH_PAT не задан — пропускаю публикацию релиза"; exit 0 }
    $v="$(APP_VERSION)"
    $branch="$(Build.SourceBranch)"
    Write-Host "Branch: $branch version: $v"
    if($branch -notlike 'refs/tags/v*'){ Write-Host "Не тег v* — релиз не создаю"; exit 0 }
    $tag=$branch -replace 'refs/tags/',''
    Write-Host "Создаю релиз $tag"
    # Генерируем notes из CHANGELOG.md (шапка версии) + стандартный блок
    $notesPath="dist/RELEASE_NOTES.md"
    $changelog=Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
    $header="# Custom Tweak By Doxaiz $tag`n`n"
    $body=@"
    ## Что скачивать
    **``CustomTweakByDoxaiz-Setup-$v.exe`` — установщик.** ``/S`` для тихой установки.
    **``CustomTweakByDoxaiz-$v.exe`` / ``.Service-$v.exe`` — portable .exe.**
    **``*-portable-win-x64.zip``** — без .NET, **``*-compact-win-x64.zip``** — с .NET 10.
    **``SHA256SUMS.txt``** — контрольные суммы.
    См. ``CHANGELOG.md`` для деталей $tag.
    "@
    Set-Content $notesPath ($header + $body) -Encoding utf8
    # Используем gh CLI если доступен, иначе REST API
    $ghCmd=Get-Command gh -ErrorAction SilentlyContinue
    if($ghCmd){
      $env:GH_TOKEN=$env:GH_PAT
      $files=(Get-ChildItem dist -File -Include *.exe,*.zip,SHA256SUMS.txt | ForEach-Object { $_.FullName }) -join " "
      Write-Host "gh release create $tag $files --notes-file $notesPath --title `"Custom Tweak By Doxaiz $tag`""
      Invoke-Expression "gh release create $tag $files --notes-file `"$notesPath`" --title `"Custom Tweak By Doxaiz $tag`" 2>&1" | Write-Host
      if($LASTEXITCODE -ne 0){ throw "gh release create failed $LASTEXITCODE" }
    } else {
      $headers=@{ Authorization="Bearer $env:GH_PAT"; Accept="application/vnd.github+json" }
      $relBody=@{ tag_name=$tag; name="Custom Tweak By Doxaiz $tag"; body=(Get-Content $notesPath -Raw); draft=$false; prerelease=$false } | ConvertTo-Json -Depth 3
      $rel=Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/Doxaiz/Custom-Tweak-By-Doxaiz/releases" -Headers $headers -Body $relBody
      $uploadUrl=$rel.upload_url -replace '\{\?name,label\}', ''
      foreach($f in Get-ChildItem dist -File -Include *.exe,*.zip,SHA256SUMS.txt){
        $h=@{ Authorization="Bearer $env:GH_PAT"; "Content-Type"="application/octet-stream" }
        Invoke-RestMethod -Method Post -Uri "$uploadUrl?name=$($f.Name)" -Headers $h -InFile $f.FullName | Out-Null
        Write-Host "Uploaded $($f.Name)"
      }
    }
    Write-Host "Релиз $tag опубликован"
  displayName: Публикация релиза GitHub (auto)
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
  env:
    GH_PAT: $(GH_PAT)
