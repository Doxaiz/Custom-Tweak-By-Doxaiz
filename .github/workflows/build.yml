name: Сборка, тесты и готовые .exe

# Что делает этот сценарий:
#   1) собирает решение и прогоняет все автотесты;
#   2) выгружает каталог твиков, перерисовывает обе витрины и гоняет четыре чекера интерфейса;
#   3) собирает .exe в двух видах, установщик (NSIS) и контрольные суммы, прикладывает их к сборке;
#   4) проверяет установщик по-настоящему: тихо ставит на сборочной Windows, смотрит файлы, ярлыки,
#      запись в «Программах и компонентах», службу, разговаривает со службой живой утилитой
#      PingForge.EngineSmoke и тихо удаляет — после чего проверяет, что следов не осталось;
#   5) на теге вида v1.0.0 — создаёт (или перезаписывает) единственный релиз с этими файлами.
#
# Запускается на каждый push и вручную из вкладки Actions.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и проверки
    runs-on: windows-latest

    env:
      # Консоль Windows по умолчанию не в UTF-8: без этих настроек печать кириллицы в python-утилитах
      # падает с UnicodeEncodeError (в самих утилитах та же защита продублирована).
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Узнать версию изделия
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
          if (-not $version) { throw 'Не нашёл версию в Directory.Build.props' }
          Write-Host "Версия изделия: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Поставить .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Скрипты — в UTF-8 с меткой (иначе Windows PowerShell читает их как cp1252)
        shell: pwsh
        run: |
          $bad = @()
          foreach ($file in Get-ChildItem scripts, tools, installer -Recurse -Include *.ps1 -File) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $doubleBom = $bytes.Length -ge 6 -and $bytes[3] -eq 0xEF -and $bytes[4] -eq 0xBB -and $bytes[5] -eq 0xBF
            Write-Host ("  {0}{1} {2}" -f ($(if ($hasBom) { 'BOM есть ' } else { 'BOM НЕТ  ' })),
                $(if ($doubleBom) { 'ДВОЙНАЯ МЕТКА ' } else { '' }), $file.FullName)
            if (-not $hasBom) { $bad += "$($file.FullName) — нет метки" }
            if ($doubleBom) { $bad += "$($file.FullName) — двойная метка" }
          }
          if ($bad.Count -gt 0) {
            throw "Скрипты без метки UTF-8: $($bad -join ', '). Windows PowerShell 5.1 прочитает их как cp1252 и сломает русские строки."
          }

      - name: Сборка
        run: dotnet build PingForge.slnx -c Release --artifacts-path "${{ runner.temp }}/art" --nologo

      - name: Тесты
        run: dotnet test PingForge.slnx -c Release --artifacts-path "${{ runner.temp }}/art" --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory "test-results"

      - name: Итог тестов (число из TRX)
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Host "::warning file=.github/workflows/build.yml,line=1::TRX not found"; exit 0 }
          [xml]$doc = Get-Content $trx.FullName -Raw
          $c = $doc.TestRun.ResultSummary.Counters
          $line = "TESTS total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed) error=$($c.error)"
          Write-Host $line
          Write-Host "::notice file=.github/workflows/build.yml,line=1::$line"
          $line >> $env:GITHUB_STEP_SUMMARY
          foreach ($result in $doc.TestRun.Results.UnitTestResult) {
            if ($result.resultType -eq 'Failed' -or $result.outcome -eq 'Failed') {
              $msg = $result.Output.ErrorInfo.Message -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Host "::error file=.github/workflows/build.yml,line=1::FAILED TEST $($result.testName) : $msg"
            }
          }

      # Витрины собираются из того же каталога, что применяет служба: если данные каталога разойдутся
      # с разметкой витрины, проверки упадут прямо здесь.
      - name: Данные каталога
        run: dotnet run --project tools/PingForge.CatalogDump -c Release --artifacts-path "${{ runner.temp }}/art" -- docs/catalog.json

      - name: Витрины — перерисовать
        run: |
          # Число автотестов берём из журнала прогона: вписанная руками цифра врёт через месяц.
          $tests = 0
          $trx = Get-ChildItem test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$doc = Get-Content $trx.FullName -Raw
            $tests = [int]$doc.TestRun.ResultSummary.Counters.total
          }
          if ($tests -gt 0) {
            Write-Host "Автотестов из журнала прогона: $tests"
            python tools/render_ui_preview.py docs/catalog.json docs/pingforge-ui-preview.html --tests $tests
          } else {
            Write-Host "Журнала тестов нет: макет честно скажет, что числа нет"
            python tools/render_ui_preview.py docs/catalog.json docs/pingforge-ui-preview.html
          }
          python tools/render_app_site.py docs/catalog.json docs/custom-tweak-by-doxaiz.html
        shell: pwsh

      - name: Витрины — проверки
        run: |
          npm install jsdom --no-save --silent
          node tools/check_ui_preview.js docs/pingforge-ui-preview.html
          node tools/check_app_site.js docs/custom-tweak-by-doxaiz.html
        shell: pwsh

      - name: Программа — компактная сборка (нужен .NET 10)
        run: dotnet publish src/PingForge.App/PingForge.App.csproj -c Release -r win-x64 --self-contained false -o dist/compact --nologo

      - name: Служба — компактная сборка
        run: dotnet publish src/PingForge.Service.Host/PingForge.Service.Host.csproj -c Release -r win-x64 --self-contained false -o dist/compact --nologo

      - name: Программа — автономная сборка (без установки .NET)
        run: >
          dotnet publish src/PingForge.App/PingForge.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false
          -o dist/portable --nologo

      - name: Служба — автономная сборка
        run: >
          dotnet publish src/PingForge.Service.Host/PingForge.Service.Host.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false
          -o dist/portable --nologo

      - name: Убрать отладочные файлы и добавить скрипты установки
        run: |
          Get-ChildItem dist -Recurse -Include *.pdb,*.xml | Remove-Item -Force
          foreach ($folder in @('dist/compact', 'dist/portable')) {
            Copy-Item scripts/*.ps1 $folder -Force
            Copy-Item docs/УСТАНОВКА.md $folder -Force
          }
        shell: pwsh

      - name: Упаковать
        run: |
          Compress-Archive -Path dist/compact/* -DestinationPath dist/CustomTweakByDoxaiz-compact-win-x64.zip -Force
          Compress-Archive -Path dist/portable/* -DestinationPath dist/CustomTweakByDoxaiz-portable-win-x64.zip -Force
          Get-ChildItem dist -File | Select-Object Name, Length
        shell: pwsh

      - name: Программа — живая проверка на Windows (окно, разделы, трей)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log'

          function Check-App([string]$title, [string]$exe) {
            Write-Host "── $title"
            Write-Host "   файл: $exe"

            if (-not (Test-Path $exe)) { throw "Нет файла: $exe" }

            # Свежий журнал: иначе можно прочитать вчерашний и обрадоваться зря.
            Remove-Item $log -ErrorAction SilentlyContinue

            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru
            $watch.Stop()
            Write-Host "   код возврата: $($process.ExitCode), время: $([math]::Round($watch.Elapsed.TotalSeconds, 1)) с"

            if (-not (Test-Path $log)) {
              throw "Журнала нет ($log): программа не дошла даже до записи журнала — значит её не пускает система (SmartScreen, антивирус или карантин)."
            }

            Get-Content $log | ForEach-Object { Write-Host "   $_" }

            if ($process.ExitCode -ne 0) {
              # Хвост журнала — в аннотацию: аннотации видны через API даже там, где полные логи
              # не скачать (например, из песочницы без доступа к хранилищу GitHub).
              $tail = (Get-Content $log | Select-Object -Last 20 | Where-Object { $_.Trim() }) -join ' | '
              if ($tail) { Write-Host "::error title=$title::$tail" }
              throw "${title}: самопроверка вернула код $($process.ExitCode). Подробности выше."
            }
          }

          Check-App 'Одиночный .exe (то, что скачивают люди)' 'dist\portable\CustomTweakByDoxaiz.exe'
          Check-App 'Компактная сборка' 'dist\compact\CustomTweakByDoxaiz.exe'

          Write-Host 'Окно, разделы, трей и каталог собираются на живой Windows.'

      # Ж: единственные проверки, где программа шлёт настоящие пакеты и читает настоящий сетевой стек,
      # а потом называет получившиеся числа. Две строки в журнале:
      #   «ЖИВОЙ ЗАМЕР» — ICMP-эхо, а если ICMP закрыт, TCP-рукопожатие;
      #   «ЖИВОЙ TCP-ЗАМЕР (iphlpapi)» — статистика уже открытого соединения из сетевого стека.
      # Сети нет, ICMP запрещён или сбор статистики не включён — «пропущено» с причиной, а не зелёный
      # результат. Ноль вместо задержки — отказ. Числа уходят в аннотацию: их видно через API даже
      # там, где полные логи не скачать.
      - name: Ж - живой замер на настоящей сети (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ann = 'file=src/PingForge.App/SelfCheck.cs,line=1'
          $log = Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log'
          $exe = 'dist\portable\CustomTweakByDoxaiz.exe'
          if (-not (Test-Path $exe)) { throw "Нет файла: $exe" }

          Remove-Item $log -ErrorAction SilentlyContinue
          $process = Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru
          Write-Host "   код возврата: $($process.ExitCode)"

          if (-not (Test-Path $log)) { throw "Журнала нет: $log — программа не дошла до записи журнала" }

          $lines = @(Get-Content $log | Where-Object { $_ -match 'ЖИВОЙ' })
          if ($lines.Count -eq 0) {
            $tail = (Get-Content $log | Select-Object -Last 12 | Where-Object { $_.Trim() }) -join ' | '
            Write-Host "::error $ann::живой замер: строк «ЖИВОЙ ЗАМЕР» в журнале нет. Хвост: $tail"
            throw 'Строк «ЖИВОЙ ЗАМЕР» нет в журнале: проверка не запускалась'
          }

          if (-not ($lines | Where-Object { $_ -match 'iphlpapi' })) {
            Write-Host "::notice $ann::живой TCP-замер: строки iphlpapi в журнале нет — проверка не дошла до неё"
          }

          # Чужой процесс: этим доказывается, что читается соединение не самопроверки, а другой программы, —
          # ровно то, что делает служба с потоком игры. Строки нет — значит проверка не дошла до неё.
          if (-not ($lines | Where-Object { $_ -match 'чужой процесс' })) {
            Write-Host "::notice $ann::живой TCP-замер по чужому процессу: строки в журнале нет — проверка не дошла до неё"
          }

          foreach ($line in $lines) {
            $safe = ($line -replace '%', '%25' -replace "`r", '' -replace "`n", ' ')
            Write-Host "::notice $ann::$safe"
          }

          $broken = @($lines | Where-Object { $_ -match 'НЕ работает' })
          if ($broken.Count -gt 0) { throw "Живой замер не работает: $($broken -join ' | ')" }
          if ($process.ExitCode -ne 0) { throw "Самопроверка вернула код $($process.ExitCode)" }

      - name: Программа — снимок живого окна на Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\portable\CustomTweakByDoxaiz.exe'
          $log = Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log'
          Remove-Item $log -ErrorAction SilentlyContinue

          Write-Host '── Запускаю программу как человек: двойной щелчок, без ключей'
          $app = Start-Process $exe -PassThru

          $deadline = (Get-Date).AddSeconds(90)
          $handle = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $app.Refresh()
            if ($app.HasExited) {
              if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "   $_" } }
              throw "Программа завершилась сама, код $($app.ExitCode) — окна нет"
            }

            $handle = $app.MainWindowHandle
            if ($handle -ne 0) { break }
          }

          if ($handle -eq 0) {
            if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "   $_" } }
            throw 'Окно не появилось за 90 секунд'
          }

          Write-Host "  [есть] окно открылось: «$($app.MainWindowTitle)»"
          if ($app.MainWindowTitle -notlike '*Custom Tweak By Doxaiz*') {
            throw "В заголовке окна не название программы: «$($app.MainWindowTitle)»"
          }

          # Дать окну дорисоваться, иначе снимок будет пустым.
          Start-Sleep -Seconds 3

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          # Типы Win32 — массивом строк: here-string в PowerShell требует закрывающую метку
          # с начала строки, а это несовместимо с отступами YAML.
          $pfWin = 'using System;',
                   'using System.Runtime.InteropServices;',
                   'public static class PfWin {',
                   '  [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }',
                   '  [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);',
                   '  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);',
                   '  [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint flags);',
                   '  [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();',
                   '}'
          Add-Type -TypeDefinition ($pfWin -join [Environment]::NewLine)

          # DPI: без этого окно и его прямоугольник считаются в «уменьшенных» пикселях,
          # и на экране с масштабом снимок выходит обрезанным по правому краю.
          [PfWin]::SetProcessDPIAware() | Out-Null
          [PfWin]::SetForegroundWindow($handle) | Out-Null
          Start-Sleep -Milliseconds 800

          # Снимок — только окно программы, а не весь рабочий стол: это картинка продукта,
          # и в ней не должно быть чужих окон сборочной машины.
          # Снимаем PrintWindow, а не с экрана: окно 1180×820 бывает больше экрана раннера,
          # и тогда CopyFromScreen терял правый край вместе с полосой прокрутки.
          $rect = New-Object PfWin+RECT
          [PfWin]::GetWindowRect($handle, [ref]$rect) | Out-Null
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          Write-Host "  окно: ${width}×${height} в точке $($rect.Left),$($rect.Top)"

          $bitmap = New-Object System.Drawing.Bitmap $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(7, 11, 20))
          $hdc = $graphics.GetHdc()
          $printed = [PfWin]::PrintWindow($handle, $hdc, 2)   # 2 = PW_RENDERFULLCONTENT
          $graphics.ReleaseHdc($hdc)
          if (-not $printed) {
            Write-Host '  PrintWindow не смог — снимаю с экрана'
            $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, (New-Object System.Drawing.Size $width, $height))
          }
          $shot = Join-Path (Get-Location) 'dist\app-window.png'
          $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          Write-Host "  [есть] снимок окна: $shot"

          if (Test-Path $log) {
            Copy-Item $log 'dist\app-start.log' -Force
            Get-Content $log | Select-Object -Last 8 | ForEach-Object { Write-Host "   $_" }
          }

          # Самопроверка на живом процессе: та же сборка, но без показа окна.
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host 'Окно показывается, программа закрыта. Снимок уйдёт в артефакты сборки.'

      # Картинку в песочнице не посмотреть (артефакты лежат на чужом хранилище), поэтому
      # о снимке говорит сама сборка: размер, средняя яркость и доля тёмных пикселей уходят
      # в аннотацию. Так видно три вещи: окно снято целиком, тёмная тема применилась,
      # и снимок не пустой. Это проверка доказательства, а не замена взгляду человека.
      - name: Снимок окна — что на нём (размер и яркость)
        if: always()
        shell: pwsh
        run: |
          $shot = 'dist\app-window.png'
          if (-not (Test-Path $shot)) {
            Write-Host '::warning file=.github/workflows/build.yml,line=1::Снимка окна нет — о вёрстке судить нечем'
            exit 0
          }

          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap $shot
          $width = $bmp.Width
          $height = $bmp.Height
          $sum = 0.0
          $dark = 0
          $bright = 0
          $n = 0
          $min = 255.0
          $max = 0.0
          for ($y = 0; $y -lt $height; $y += 4) {
            for ($x = 0; $x -lt $width; $x += 4) {
              $c = $bmp.GetPixel($x, $y)
              $l = 0.2126 * $c.R + 0.7152 * $c.G + 0.0722 * $c.B
              $sum += $l
              $n++
              if ($l -lt 40) { $dark++ }
              if ($l -gt 140) { $bright++ }
              if ($l -lt $min) { $min = $l }
              if ($l -gt $max) { $max = $l }
            }
          }
          $bmp.Dispose()

          $mean = if ($n -gt 0) { [math]::Round($sum / $n, 1) } else { 0 }
          $darkPct = if ($n -gt 0) { [math]::Round(100 * $dark / $n, 1) } else { 0 }
          $brightPct = if ($n -gt 0) { [math]::Round(100 * $bright / $n, 1) } else { 0 }
          $line = "Снимок окна {0}x{1}: средняя яркость {2}%, тёмных {3}%, светлых {4}%" -f $width, $height, $mean, $darkPct, $brightPct
          Write-Host "  $line"
          Write-Host "::notice file=.github/workflows/build.yml,line=1::$line"

          # Проверки, а не только цифры: аннотаций на шаг отводится немного, и «notice» с числами
          # до человека может не дойти. Зато зелёный шаг означает, что условия ниже выполнены.
          if (($max - $min) -lt 8) {
            throw 'Снимок окна одноцветный: окно не отрисовалось, судить о вёрстке нечем'
          }
          if ($darkPct -lt 55) {
            throw "Снимок окна не тёмный: тёмных пикселей $darkPct%, средняя яркость $mean% — тёмная тема, похоже, не применилась"
          }
          # Ширину сравниваем не с желаемыми 1180, а с MinWidth окна (860): на сборочной машине
          # рабочий стол 1024x768, и Windows сама ужимает окно до рабочей области (в прогоне
          # 44037445223 вышло 1008x704). Меньше MinWidth снимок быть не может — значит обрезан.
          if ($width -lt 860) {
            throw "Снимок окна шириной $width меньше MinWidth окна (860) — край обрезан, вёрстку по нему не проверить"
          }
          if ($mean -gt 60) {
            Write-Host "::warning file=.github/workflows/build.yml,line=1::Снимок темноват наполовину: средняя яркость $mean%"
          }

      - name: Установщик — собрать (NSIS)
        run: |
          $ErrorActionPreference = 'Stop'
          # Ошибку makensis видно только в журнале, а журнал из песочницы не скачать: поэтому
          # причина уходит в аннотацию — её читает и человек, и автоматическая проверка.
          trap {
            Write-Host "::error file=installer/CustomTweakByDoxaiz.nsi,line=1::NSIS: $($_.Exception.Message)"
            exit 1
          }

          # NSIS есть не на всякой сборочной машине: если его нет — ставим и ищем в нескольких
          # местах. Путь проверяем оба (x86 и x64): пакет может лечь в любой, а Get-Command в
          # текущей сессии PATH не видит — Chocolatey обновляет его только для новых процессов.
          function Find-Makensis {
            foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (-not $base) { continue }
              $candidate = Join-Path $base 'NSIS\makensis.exe'
              if (Test-Path $candidate) { return $candidate }
            }

            $found = Get-Command makensis -ErrorAction SilentlyContinue
            if ($found) { return $found.Source }

            return $null
          }

          # Chocolatey правит PATH только для новых процессов — текущему его надо перечитать.
          function Update-PathFromRegistry {
            $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $user = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = (@($machine, $user) | Where-Object { $_ }) -join ';'
          }

          $chocoExit = $null
          $wingetExit = $null
          $makensis = Find-Makensis
          if (-not $makensis) {
            Write-Host 'NSIS не найден — ставлю через choco.'
            $chocoOutput = choco install nsis --no-progress -y 2>&1
            $chocoExit = $LASTEXITCODE
            Write-Host "choco exit: $chocoExit"
            $chocoOutput | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
            Update-PathFromRegistry
            $makensis = Find-Makensis
          }

          if (-not $makensis) {
            Write-Host 'choco не помог — пробую winget.'
            $wingetOutput = winget install --id NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements 2>&1
            $wingetExit = $LASTEXITCODE
            Write-Host "winget exit: $wingetExit"
            $wingetOutput | Select-Object -Last 15 | ForEach-Object { Write-Host $_ }
            Update-PathFromRegistry
            $makensis = Find-Makensis
          }

          if (-not $makensis) {
            Write-Host 'choco и winget не помогли — ищу makensis на диске.'
            $makensis = (Get-ChildItem 'C:\Program Files*' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1).FullName
          }

          if (-not $makensis) {
            $tail = (($chocoOutput | Select-Object -Last 10) -join ' | ')
            Write-Host "::error file=installer/CustomTweakByDoxaiz.nsi,line=1::NSIS не установился (choco exit $chocoExit, winget exit $wingetExit): $tail"
            throw "Не нашёл makensis ни в Program Files, ни в PATH, ни на диске"
          }
          Write-Host "makensis: $makensis"

          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
          Write-Host "Версия изделия: $version"

          # Пути — полные: makensis ищет файлы от папки скрипта (installer\), а не от корня сборки.
          # И кавычки у -D обязательны: без них PowerShell не раскрывает переменную внутри «-DИМЯ=$значение».
          $sourceDir = (Resolve-Path 'dist\portable').Path
          $outDir = (Resolve-Path 'dist').Path
          Write-Host 'Файлы, из которых собирается установщик:'
          Get-ChildItem $sourceDir -File | Select-Object Name, @{n='МБ';e={[math]::Round($_.Length / 1MB, 1)}}

          $makensisOutput = & $makensis -INPUTCHARSET UTF8 "-DVERSION=$version" "-DSOURCE_DIR=$sourceDir" "-DOUT_DIR=$outDir" "installer\CustomTweakByDoxaiz.nsi" 2>&1
          $makensisOutput | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($makensisOutput | Select-Object -Last 12) -join ' | '
            Write-Host "::error file=installer/CustomTweakByDoxaiz.nsi,line=1::makensis exit $LASTEXITCODE : $tail"
            throw "makensis вернул код $LASTEXITCODE"
          }

          Get-Item "dist\CustomTweakByDoxaiz-Setup-$version.exe" | Select-Object Name, @{n='МБ';e={[math]::Round($_.Length / 1MB, 1)}}
        shell: pwsh

      - name: Установщик — проверка на Windows (тихая установка, служба, живой разговор, удаление)
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
          $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
          $installDir = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz'
          $arp = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\CustomTweakByDoxaiz'

          Write-Host '── Тихая установка (то же, что двойной щелчок, только без вопросов)'
          $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Установщик вернул код $($install.ExitCode)" }

          foreach ($name in @('CustomTweakByDoxaiz.exe', 'CustomTweakByDoxaiz.Service.exe', 'Uninstall.exe',
                              'install-service.ps1', 'uninstall-service.ps1', 'УСТАНОВКА.md')) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) { throw "После установки нет файла: $path" }
            Write-Host "  [есть] $name"
          }

          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Custom Tweak By Doxaiz\Custom Tweak By Doxaiz.lnk'
          if (-not (Test-Path $shortcut)) { throw "Нет ярлыка в меню «Пуск»: $shortcut" }
          Write-Host '  [есть] ярлык в меню «Пуск»'

          if (-not (Test-Path $arp)) { throw 'Нет записи в «Программах и компонентах»' }
          Write-Host "  [есть] запись в списке программ, версия $((Get-ItemProperty $arp).DisplayVersion)"

          Write-Host '── Служба'
          $service = Get-Service -Name PingForge -ErrorAction SilentlyContinue
          if (-not $service) {
            $log = Join-Path $installDir 'install-service.log'
            if (Test-Path $log) {
              Write-Host '── Журнал установки службы:'
              Get-Content $log | Select-Object -Last 80
            } else {
              Write-Host "Журнала регистрации нет: $log"
            }

            Write-Host '── Повторяю регистрацию вручную, с выводом на экран'
            & (Join-Path $installDir 'install-service.ps1') -NoShortcut
            Write-Host "код возврата скрипта: $LASTEXITCODE"

            throw 'Служба PingForge не зарегистрирована'
          }
          (Get-Service -Name PingForge).WaitForStatus('Running', [TimeSpan]::FromSeconds(90))
          Write-Host "  Служба работает: $((Get-Service -Name PingForge).Status)"

          Write-Host '── Живой разговор со службой (тем же каналом, что у окна программы)'
          $smoke = "${{ runner.temp }}/art/bin/PingForge.EngineSmoke/release/PingForge.EngineSmoke.exe"
          if (-not (Test-Path $smoke)) { throw "Не нашёл утилиту проверки: $smoke" }
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw "Живая проверка службы вернула код $LASTEXITCODE" }

          Write-Host '── Программа на месте: окно, разделы, трей и разговор со службой'
          $appLog = Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log'
          Remove-Item $appLog -ErrorAction SilentlyContinue
          $app = Start-Process (Join-Path $installDir 'CustomTweakByDoxaiz.exe') -ArgumentList '--self-check' -Wait -PassThru
          Write-Host "  код возврата программы: $($app.ExitCode)"
          if (-not (Test-Path $appLog)) { throw "Установленная программа не оставила журнал: $appLog" }
          Get-Content $appLog | ForEach-Object { Write-Host "  $_" }
          if ($app.ExitCode -ne 0) { throw "Самопроверка установленной программы вернула код $($app.ExitCode)" }
          if (-not (Select-String -Path $appLog -SimpleMatch 'СЛУЖБА: отвечает' -Quiet)) {
            throw 'Программа не увидела службу: в журнале нет строки «СЛУЖБА: отвечает»'
          }
          Write-Host '  [есть] программа видит службу — тем же каналом, что и окно'

          Write-Host '── Тихое удаление'
          $remove = Start-Process (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Удаление вернуло код $($remove.ExitCode)" }

          if (Test-Path $installDir) { throw "Папка установки осталась: $installDir" }
          if (Get-Service -Name PingForge -ErrorAction SilentlyContinue) { throw 'Служба осталась после удаления' }
          if (Test-Path $arp) { throw 'Запись в «Программах и компонентах» осталась' }
          if (Test-Path $shortcut) { throw 'Ярлык остался после удаления' }

          $dataDir = Join-Path $env:ProgramData 'PingForge'
          if (Test-Path $dataDir) { Write-Host "  Данные оставлены, как и обещано в вопросе: $dataDir" }

          Write-Host 'Установщик проверен: ставит, запускает службу, удаляется без следов.'
        shell: pwsh

      - name: Диагностика службы (при любом исходе)
        if: always()
        shell: pwsh
        run: |
          function Show-Tail([string]$title, [string]$path, [int]$count = 50) {
            if (-not (Test-Path $path)) {
              Write-Host "::warning file=.github/workflows/build.yml,line=1::no file $title ($path)"
              return
            }
            $lines = Get-Content $path -Tail $count | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' }
            $body = [string]::Join('%0A', $lines)
            Write-Host "::error file=.github/workflows/build.yml,line=1::$title : $body"
          }
          $svc = Get-Service -Name PingForge -ErrorAction SilentlyContinue
          $installDir = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz'
          $state = @()
          $state += "service=$($svc.Status)"
          foreach ($name in @('CustomTweakByDoxaiz.exe', 'CustomTweakByDoxaiz.Service.exe', 'Uninstall.exe', 'install-service.ps1')) {
            $state += "$name=$(Test-Path (Join-Path $installDir $name))"
          }
          $state += "arp=$(Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\CustomTweakByDoxaiz')"
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Custom Tweak By Doxaiz\Custom Tweak By Doxaiz.lnk'
          $state += "shortcut=$(Test-Path $shortcut)"
          Write-Host "::notice file=.github/workflows/build.yml,line=1::install state: $($state -join '; ')"
          New-Item -ItemType Directory -Force test-results | Out-Null
          $svcLog = Join-Path $env:ProgramData 'PingForge\service.log'
          if (Test-Path $svcLog) { Copy-Item $svcLog test-results\service.log -Force }
          $hits = Select-String -Path $svcLog -Pattern 'Слушаю канал|Подключился|ОТКАЗ|Команда|ошиб|Клиент отключился' -ErrorAction SilentlyContinue | Select-Object -Last 30 | ForEach-Object { $_.Line -replace '%', '%25' }
          if ($hits) { Write-Host "::error file=.github/workflows/build.yml,line=1::service.log hits : $([string]::Join('%0A', $hits))" }
          $proc = Get-Process -Name 'CustomTweakByDoxaiz.Service' -ErrorAction SilentlyContinue
          Write-Host "::notice file=.github/workflows/build.yml,line=1::service process: $($proc.Id -join ',') path=$($proc.Path -join ',')"
          Write-Host "::notice file=.github/workflows/build.yml,line=1::service.log length=$((Get-Item $svcLog -ErrorAction SilentlyContinue).Length) modified=$((Get-Item $svcLog -ErrorAction SilentlyContinue).LastWriteTime)"
          Show-Tail 'service.log' $svcLog
          Show-Tail 'install-service.log' (Join-Path $installDir 'install-service.log')
          Show-Tail 'app-start.log' (Join-Path $env:LOCALAPPDATA 'CustomTweakByDoxaiz\app-start.log')

      - name: C7 - live identity checks on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
          $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
          $smoke = "${{ runner.temp }}/art/bin/PingForge.EngineSmoke/release/PingForge.EngineSmoke.exe"
          if (-not (Test-Path $setup)) { throw "No setup file: $setup" }
          if (-not (Test-Path $smoke)) { throw "No smoke file: $smoke" }
          & tools\c7-live-checks.ps1 -SetupPath $setup -SmokePath $smoke
          if ($LASTEXITCODE -ne 0) { throw "C7 live checks exit $LASTEXITCODE" }

      # Задача B: узлы маршрутизации на живой Windows через канал службы. Только чтение
      # (route print + Get-NetAdapter). На раннере нет второго канала — и ответ обязан быть
      # честным: «кандидатов кроме текущего шлюза нет». Шаг герметичный: служба к этому моменту
      # после C7 снята, поэтому ставим установщик сами, проверяем и убираем за собой.
      # Вывод — в артефакты как доказательство.
      - name: B - routing nodes live check via service pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ann = 'file=tools/c7-live-checks.ps1,line=1'
          try {
            $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
            $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
            $smoke = "${{ runner.temp }}/art/bin/PingForge.EngineSmoke/release/PingForge.EngineSmoke.exe"
            Write-Host "::notice $ann::routing-live pre: setup=$(Test-Path $setup) smoke=$(Test-Path $smoke)"
            if (-not (Test-Path $smoke)) { throw "no smoke file at $smoke" }

            $svc = Get-Service -Name PingForge -ErrorAction SilentlyContinue
            Write-Host "::notice $ann::routing-live service: exists=$($svc -ne $null) status=$($svc.Status)"
            if ($svc -eq $null) {
              if (-not (Test-Path $setup)) { throw "no service and no setup at $setup" }
              $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
              if ($install.ExitCode -ne 0) { throw "setup exit $($install.ExitCode)" }
            } elseif ($svc.Status -ne 'Running') {
              Start-Service PingForge -ErrorAction SilentlyContinue
            }
            (Get-Service -Name PingForge).WaitForStatus('Running', [TimeSpan]::FromSeconds(90))
            Start-Sleep -Seconds 4

            $code = 1
            $out = ''
            foreach ($attempt in 1..2) {
              $out = & $smoke 2>&1 | Out-String
              $code = $LASTEXITCODE
              if ($code -eq 0) { break }
              Start-Sleep -Seconds 6
            }
            New-Item -ItemType Directory -Force test-results | Out-Null
            $out | Set-Content test-results\routing-live.log -Encoding utf8

            $routeLine = (($out -split "`n" | Select-String -SimpleMatch '[6/7]') -join '').Trim()
            $checks = (($out -split "`n" | Where-Object { $_ -match 'x1b|\[\d/\d\]' -or $_ -match '[0-9]/[0-9]' }) -join ' | ').Trim()
            $checks = $checks -replace '%','%25' -replace "`r",''
            Write-Host "::notice $ann::routing-live exit=$code; checks: $checks"

            if ($code -ne 0) {
              $last = (($out -split "`n" | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 8) -join ' | ') -replace '%','%25' -replace "`r",''
              Write-Host "::error $ann::routing-live tail: $last"
              throw "EngineSmoke exit $code"
            }
            if ($routeLine -notmatch '6/7') { throw 'line [6/7] missing from smoke output' }

            $uninstaller = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz\Uninstall.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait | Out-Null }
            Write-Host "::notice $ann::routing-live OK: $routeLine"
          } catch {
            Write-Host "::error $ann::routing-live failed: $($_.Exception.Message -replace '%','%25')"
            exit 1
          }

      # G1: распознавание игрового потока на живой Windows — Minecraft (Java) и Fortnite.
      # Настоящих игр на раннере нет (лицензия, аккаунт, GPU), поэтому проверяется живой сетевой поток
      # процесса с именем клиента игры: служба видит то же, что у человека с запущенной игрой.
      - name: "G1 - game flow detection: Minecraft/Fortnite names (live)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ann = 'file=tools/games-live-checks.ps1,line=1'
          try {
            $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
            $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
            $smoke = "${{ runner.temp }}/art/bin/PingForge.EngineSmoke/release/PingForge.EngineSmoke.exe"
            if (-not (Test-Path $setup)) { throw "no setup file: $setup" }
            if (-not (Test-Path $smoke)) { throw "no smoke file: $smoke" }

            $svc = Get-Service -Name PingForge -ErrorAction SilentlyContinue
            if ($null -eq $svc) {
              $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
              if ($install.ExitCode -ne 0) { throw "setup exit $($install.ExitCode)" }
              (Get-Service -Name PingForge).WaitForStatus('Running', [TimeSpan]::FromSeconds(120))
              Start-Sleep -Seconds 4
            } elseif ($svc.Status -ne 'Running') {
              Start-Service PingForge
              (Get-Service -Name PingForge).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
            }

            & tools\games-live-checks.ps1 -SmokePath $smoke
            $code = $LASTEXITCODE
            Write-Host "::notice $ann::games-live exit=$code"

            $uninstaller = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz\Uninstall.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait | Out-Null }

            if ($code -ne 0) { throw "games live checks exit $code" }
          } catch {
            Write-Host "::error $ann::games-live failed: $($_.Exception.Message -replace '%','%25')"
            $uninstaller = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz\Uninstall.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait | Out-Null }
            exit 1
          }

      # Задача U: повреждённый файл базы не должен ронять службу в цикле рестартов.
      # Шаг сам ставит установщик, портит заголовок базы, проверяет запуск и убирает за собой.
      - name: "U - corrupted database: service starts (live)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
          $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
          $smoke = "${{ runner.temp }}/art/bin/PingForge.EngineSmoke/release/PingForge.EngineSmoke.exe"
          if (-not (Test-Path $setup)) { throw "no setup file: $setup" }
          if (-not (Test-Path $smoke)) { throw "no smoke file: $smoke" }
          & tools\u-live-checks.ps1 -SetupPath $setup -SmokePath $smoke
          if ($LASTEXITCODE -ne 0) { throw "U live checks exit $LASTEXITCODE" }

      - name: T - uninstall leaves nothing and update keeps state (live)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ann = 'file=scripts/uninstall-service.ps1,line=1'

          function Query-Engine {
              param([string]$Pipe, [string]$Command, [hashtable]$CmdArgs)
              $p = New-Object System.IO.Pipes.NamedPipeClientStream('.', $Pipe, [System.IO.Pipes.PipeDirection]::InOut)
              try {
                  try { $p.Connect(8000) } catch { return $null }
                  $req = [ordered]@{ id = [Guid]::NewGuid().ToString('N'); command = $Command }
                  if ($CmdArgs) { $req['args'] = $CmdArgs }
                  $b = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json $req -Compress))
                  $p.Write([BitConverter]::GetBytes([int32]$b.Length), 0, 4)
                  $p.Write($b, 0, $b.Length)
                  $p.Flush()
                  $h = New-Object byte[] 4
                  for ($i = 0; $i -lt 4; ) { $n = $p.Read($h, $i, 4 - $i); if ($n -le 0) { return $null }; $i += $n }
                  $len = [BitConverter]::ToInt32($h, 0)
                  if ($len -le 0 -or $len -gt 1048576) { return $null }
                  $body = New-Object byte[] $len
                  for ($i = 0; $i -lt $len; ) { $n = $p.Read($body, $i, $len - $i); if ($n -le 0) { return $null }; $i += $n }
                  return [Text.Encoding]::UTF8.GetString($body) | ConvertFrom-Json
              } finally { $p.Dispose() }
          }

          function Clean-Answer([string]$text) {
              if (-not $text) { return '' }
              ($text -replace '[\r\n]+', ' ' -replace '%', '%25').Trim()
          }

          try {
            Write-Host "::notice $ann::T start: live cycles of task T"
            New-Item -ItemType Directory -Force test-results | Out-Null
            Start-Transcript -Path test-results\t-uninstall.log -Force | Out-Null

            $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value
            $setup = "dist\CustomTweakByDoxaiz-Setup-$version.exe"
            $installDir = Join-Path $env:ProgramFiles 'Custom Tweak By Doxaiz'
            $dataDir = Join-Path $env:ProgramData 'PingForge'
            $mainPipe = 'PingForge.Engine.v1'
            $roPipe = 'PingForge.Engine.ReadOnly.v1'

            function Purge-All {
                Get-Service PingForge -ErrorAction SilentlyContinue | ForEach-Object {
                    sc.exe stop PingForge | Out-Null; Start-Sleep -Seconds 2
                    sc.exe delete PingForge | Out-Null; Start-Sleep -Seconds 2
                }
                if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue }
                if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }
            }

            function Install-Quiet([string]$Setup) {
                $proc = Start-Process $Setup -ArgumentList '/S' -Wait -PassThru
                if ($proc.ExitCode -ne 0) { throw "setup /S exit $($proc.ExitCode)" }
                (Get-Service -Name PingForge).WaitForStatus('Running', [TimeSpan]::FromSeconds(90))
                Start-Sleep -Seconds 3
            }

            # ── цикл A: установка → применение → удаление с откатом (требование 1 и 5) ─────────
            Purge-All
            Install-Quiet $setup

            $apply = Query-Engine $mainPipe 'apply-tweaks' @{ tweaks = 'TCP_NO_DELAY' }
            Write-Host "::notice $ann::T apply ok=$($apply.ok) msg=$(Clean-Answer $apply.messageRu)"
            if (-not $apply -or -not $apply.ok) { throw 'T: apply-tweaks (safe TCP_NODELAY) failed on cycle A' }

            # Скрипт снятия лежит ВНЕ папки установки на время своего запуска: иначе он удалит сам себя на ходу.
            $scriptTmp = Join-Path $env:RUNNER_TEMP 't-uninstall-service.ps1'
            Copy-Item (Join-Path $installDir 'uninstall-service.ps1') $scriptTmp -Force

            & $scriptTmp -NonInteractive
            $refusalCode = $LASTEXITCODE
            Write-Host "::notice $ann::T refusal-exit=$refusalCode (ожидался 2: есть применённые изменения, выбор не задан)"
            if ($refusalCode -ne 2) { throw "T: uninstall without choice must exit 2, got $refusalCode" }
            if (-not (Get-Service PingForge -ErrorAction SilentlyContinue)) { throw 'T: refusal path deleted the service' }

            & $scriptTmp -RollbackAndRemove -RemoveData
            $cleanCode = $LASTEXITCODE
            Write-Host "::notice $ann::T rollback+remove exit=$cleanCode"
            if ($cleanCode -ne 0) { throw "T: uninstall with rollback exit $cleanCode" }
            if (Get-Service PingForge -ErrorAction SilentlyContinue) { throw 'T: service left behind' }
            if (Test-Path $dataDir) { throw 'T: data left behind after -RemoveData' }
            if (Test-Path $installDir) { throw 'T: install dir left behind' }
            Write-Host "::notice $ann::T-cycleA OK: applied tweak -> refusal -> rollback + clean removal"

            # ── цикл B: установка поверх работающей службы (требование 3) ─────────────────────
            Install-Quiet $setup
            $apply2 = Query-Engine $mainPipe 'apply-tweaks' @{ tweaks = 'TCP_NO_DELAY' }
            if (-not $apply2 -or -not $apply2.ok) { throw 'T: apply-tweaks failed on cycle B' }
            $settingsFile = Join-Path $dataDir 'settings.json'
            $settingsHash = if (Test-Path $settingsFile) { (Get-FileHash $settingsFile).Hash } else { 'absent' }
            $dbBefore = (Get-Item (Join-Path $dataDir 'pingforge.db')).Length

            # Тот же установщик поверх работыющей службы — проверка, что занятый бинарник службы
            # заменяется (net stop в секции установки), а данные и журнал остаются.
            Install-Quiet $setup
            $ping = Query-Engine $roPipe 'ping'
            $pd = $null
            if ($ping -and $ping.dataJson) { $pd = $ping.dataJson | ConvertFrom-Json }
            $svcVersion = if ($pd) { [string]$pd.appVersion } else { 'unknown' }
            Write-Host "::notice $ann::T upgraded service version=$svcVersion expected=$version"
            if ($svcVersion -ne $version) { throw "T: version after upgrade is $svcVersion, expected $version" }

            $settingsHash2 = if (Test-Path $settingsFile) { (Get-FileHash $settingsFile).Hash } else { 'absent' }
            if ($settingsHash2 -ne $settingsHash) { throw 'T: update touched settings.json' }
            $dbAfter = (Get-Item (Join-Path $dataDir 'pingforge.db')).Length
            if ($dbAfter -lt $dbBefore) { throw "T: database shrank during update ($dbBefore -> $dbAfter)" }
            $journal = Query-Engine $roPipe 'journal-tail' @{ limit = '50' }
            if (-not $journal -or -not $journal.ok) { throw 'T: journal unreadable after update' }
            if ($journal.dataJson -notmatch 'TCP_NO_DELAY' -and $journal.messageRu -notmatch 'TCP_NO_DELAY') {
                throw 'T: applied tweak entry disappeared from journal during update'
            }
            $rb = Query-Engine $mainPipe 'rollback'
            Write-Host "::notice $ann::T rollback-from-old-snapshot ok=$($rb.ok) msg=$(Clean-Answer $rb.messageRu)"
            if (-not $rb -or -not $rb.ok) { throw 'T: rollback from pre-update snapshot failed' }
            Write-Host "::notice $ann::T-cycleB OK: over-install kept settings/journal/snapshot, version updated, rollback works"

            # ── цикл C: апгрейд поверх ПОСЛЕДНЕЙ подтверждённой стабильной версии ────────────
            # Базу не выдумываем и не хардкодим: просим GitHub API. Если latest — это уже текущая
            # собираемая версия (релизный тег гонится за кодом), берём предыдущий релиз списка.
            try {
                Purge-All
                $hdr = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN" }
                $rels = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=5" -Headers $hdr
                $baseRelease = $rels | Where-Object { -not $_.prerelease -and $_.tag_name -ne "v$version" } | Select-Object -First 1
                if (-not $baseRelease) { throw 'нет предыдущего стабильного релиза для базового сравнения' }
                Write-Host "::notice $ann::T upgrade baseline = $($baseRelease.tag_name) (latest stable, confirmed by API)"
                $asset = $baseRelease.assets | Where-Object { $_.name -like '*Setup*.exe' } | Select-Object -First 1
                if (-not $asset) { throw "у $($baseRelease.tag_name) нет Setup-ассета" }
                $oldSetup = Join-Path $env:RUNNER_TEMP ('setup-' + $baseRelease.tag_name + '.exe')
                Invoke-WebRequest -Uri $asset.url -Headers @{ Accept = 'application/octet-stream'; Authorization = "Bearer $env:GITHUB_TOKEN" } -OutFile $oldSetup
                Install-Quiet $oldSetup
                $oldApply = Query-Engine $mainPipe 'apply-tweaks' @{ tweaks = 'TCP_NO_DELAY' }
                Write-Host "::notice $ann::T $($baseRelease.tag_name) apply ok=$($oldApply.ok) msg=$(Clean-Answer $oldApply.messageRu)"
                if (-not $oldApply -or -not $oldApply.ok) { throw "базовый релиз отклонил безопасный твик" }
                Install-Quiet $setup
                $ping3 = Query-Engine $roPipe 'ping'
                $pd3 = if ($ping3 -and $ping3.dataJson) { $ping3.dataJson | ConvertFrom-Json } else { $null }
                $v3 = if ($pd3) { [string]$pd3.appVersion } else { 'unknown' }
                if ($v3 -ne $version) { throw "T: after upgrade over $($baseRelease.tag_name) version is $v3, expected $version" }
                $journal3 = Query-Engine $roPipe 'journal-tail' @{ limit = '100' }
                if (-not $journal3 -or -not $journal3.ok) { throw "T: journal from $($baseRelease.tag_name) unreadable after upgrade" }
                $rb3 = Query-Engine $mainPipe 'rollback'
                if (-not $rb3 -or -not $rb3.ok) { throw "T: rollback of $($baseRelease.tag_name)-era snapshot failed" }
                Write-Host "::notice $ann::T-cycleC OK: $($baseRelease.tag_name) -> $version, journal kept, rollback works"
            } catch {
                Write-Host "::notice $ann::T baseline-release stage did not run: $(Clean-Answer $_.Exception.Message)"
            }

            Purge-All
            Stop-Transcript -ErrorAction SilentlyContinue | Out-Null
            Write-Host "::notice $ann::T-live OK: uninstall asks and reverts, update keeps everything"
          } catch {
            Stop-Transcript -ErrorAction SilentlyContinue | Out-Null
            Write-Host "::error $ann::T failed: $(($_.Exception.Message -replace '[\r\n]+',' ') -replace '%','%25')"
            exit 1
          }

      - name: Готовые .exe и контрольные суммы
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content Directory.Build.props -Raw)).Groups[1].Value

          # Отдельные .exe — для тех, кому не нужен ни архив, ни установщик.
          Copy-Item dist\portable\CustomTweakByDoxaiz.exe "dist\CustomTweakByDoxaiz-$version.exe" -Force
          Copy-Item dist\portable\CustomTweakByDoxaiz.Service.exe "dist\CustomTweakByDoxaiz.Service-$version.exe" -Force

          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt -Encoding utf8

          Get-ChildItem dist -File | Select-Object Name, @{n='МБ';e={[math]::Round($_.Length / 1MB, 1)}}
          Get-Content dist\SHA256SUMS.txt
        shell: pwsh

      # Тяжёлые dist-артефакты (.exe/.zip) грузятся только на релизных тегах: там же эти файлы
      # едут и в ассеты релиза. На каждый push ~280 МБ artifact выжимали квоту хранилища Actions
      # в ноль, и с 18 октября загрузка журналов падала молча — это и чиним.
      - name: Приложить к сборке
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: CustomTweakByDoxaiz-win-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/app-window.png
            dist/app-start.log
            dist/install-service.log
          if-no-files-found: error

      - name: Релиз (только на тег)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Custom Tweak By Doxaiz ${{ github.ref_name }}
          body: |
            ## Что скачивать

            **`CustomTweakByDoxaiz-Setup-${{ steps.version.outputs.version }}.exe` — установщик, обычный случай.** Один файл: двойной щелчок,
            «Далее», готово. Он сам положит программу в «C:\Program Files\Custom Tweak By Doxaiz», зарегистрирует
            и запустит службу, создаст ярлыки и появится в «Программах и компонентах». Ничего доустанавливать
            не нужно. При удалении служба снимается, а журнал и снапшоты остаются — их можно удалить отдельным
            вопросом, но молча ничего не пропадает.

            **`CustomTweakByDoxaiz-${{ steps.version.outputs.version }}.exe` — та же программа одним файлом, без установки.** Просто запустить.
            Службу придётся поставить отдельно (второй .exe ниже и скрипт `install-service.ps1`), иначе программе
            будет нечем менять настройки: менять систему может только служба с правами администратора.

            **`CustomTweakByDoxaiz.Service-${{ steps.version.outputs.version }}.exe`** — служба отдельным файлом. Положить рядом с программой
            и вызвать `install-service.ps1` от имени администратора.

            **`CustomTweakByDoxaiz-portable-win-x64.zip`** — автономная сборка архивом: .NET не нужен,
            внутри оба .exe, скрипты и инструкция.

            **`CustomTweakByDoxaiz-compact-win-x64.zip`** — компактная сборка: нужен
            [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).

            **`SHA256SUMS.txt`** — контрольные суммы файлов: можно сверить, что скачалось ровно то, что собрано.

            ## Что важно знать

            Сразу после установки программа НИЧЕГО не меняет. Любое изменение — только после нажатия кнопки
            в окне и подтверждения, с предложением точки восстановления и со снапшотом прежних значений.
            Программа не влезает в игру и не трогает её память, не выключает анти-читы, Защитник, брандмауэр,
            обновления и UAC, не подменяет MAC/IP, не собирает телеметрию.

            Установщик не подписан сертификатом EV, поэтому SmartScreen может показать предупреждение —
            «Подробнее» → «Выполнить в любом случае». Подпись появится, когда будет сертификат.
          # Имена без номера версии: следующий релиз не потребует править этот список.
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      # Только доказательства: TRX, журнал службы, вывод живых проверок и один снимок окна.
      # Никаких bin/, obj/ и многосотмегабайтных слепков — retention 3 дня, чтобы следы прогонов
      # не съедали квоту, которую и так превысили старые dist-артефакты.
      - name: Журналы и результаты тестов (всегда)
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-results-and-logs
          retention-days: 3
          path: |
            test-results/**/*.trx
            dist/app-window.png
            dist/app-start.log
            dist/install-service.log
            test-results/service.log
            test-results/routing-live.log
            test-results/c7-live-checks.log
            test-results/t-uninstall.log
            test-results/u-live.log
          if-no-files-found: warn
